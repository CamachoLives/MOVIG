<header id="header" class="header d-flex align-items-center fixed-top">
  <div
    class="container-fluid container-xl position-relative d-flex align-items-center justify-content-between"
  >
    <a routerLink="/" class="logo d-flex align-items-center">
      <!-- Uncomment the line below if you also wish to use an image logo -->
      <!-- <img src="assets/img/logo.png" alt=""> -->
      <h1 class="sitename">MOVIG</h1>
    </a>

    <nav id="navmenu" class="navmenu">
      <ul>
        <li>
          <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMobileNav()"
            >Inicio</a
          >
        </li>
        <li>
          <a routerLink="/about" routerLinkActive="active" (click)="closeMobileNav()"
            >Sobre Nosotros</a
          >
        </li>
        <li>
          <a routerLink="/services" routerLinkActive="active" (click)="closeMobileNav()"
            >Servicios</a
          >
        </li>
        <li>
          <a routerLink="/portfolio" routerLinkActive="active" (click)="closeMobileNav()"
            >Portafolio</a
          >
        </li>
        <!-- Equipo y Blog quedaron ocultos en el sitio original:
        <li><a routerLink="/team" routerLinkActive="active">Equipo</a></li>
        <li><a routerLink="/blog" routerLinkActive="active">Blog</a></li>
        -->
        <li>
          <a routerLink="/contact" routerLinkActive="active" (click)="closeMobileNav()">Contacto</a>
        </li>
      </ul>
      <i
        class="mobile-nav-toggle d-xl-none bi"
        [class.bi-list]="!mobileNavActive()"
        [class.bi-x]="mobileNavActive()"
        (click)="toggleMobileNav()"
      ></i>
    </nav>
  </div>
</header>
